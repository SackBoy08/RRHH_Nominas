name: CI - Nominas Guate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-nominas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ... (tus jobs lint, test, build tal como ya los tienes) ...

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # ← solo en tags v*
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nominas_guate                   # ← mismo nombre que subes en build
          path: ./dist

      - name: List artifact
        run: ls -lah ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/nominas_guate.zip       # ← sube el zip al release
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # (OPCIONAL) Deploy a producción con aprobación
  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production                          # ← configura Environments en GitHub
      url: https://tu-dominio-o-ip             # opcional
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nominas_guate
          path: ./dist

      # Ejemplo deploy por SSH/SCP (usa tus propios scripts)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host prod\n  HostName ${{ secrets.SSH_HOST }}\n  User ${{ secrets.SSH_USER }}\n  StrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Upload package
        run: scp ./dist/nominas_guate.zip prod:/var/www/nominas/nominas_guate.zip

      - name: Remote unpack & deploy
        run: |
          ssh prod '
            set -e
            cd /var/www/nominas
            unzip -o nominas_guate.zip
            # aquí puedes mover RRHH_Nominas/ a tu docroot, limpiar cache, reiniciar servicio, etc.
          '
