name: CI - Nominas Guate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]                # dispara también cuando pushees un tag v*
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-nominas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====== ROOT JOB (sin needs) ======
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 -I{} php -l "{}"

  # ====== TESTS (con MySQL service) ======
  test:
    name: Tests (MySQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nominas_guate
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Verify dump file exists
        run: |
          ls -lah
          test -f nominas_guate.sql || { echo "❌ No se encontró nominas_guate.sql en la raíz del repo"; exit 1; }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: mysqli

      - name: Wait for MySQL & create DB
        env:
          MYSQL_PWD: root
        run: |
          # espera activa hasta 60s a que el servicio esté listo
          for i in {1..60}; do
            if mysqladmin --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot ping >/dev/null 2>&1; then
              echo "✅ MySQL listo"; break
            fi
            echo "⏳ Esperando MySQL... ($i)"; sleep 1
          done
          mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot -e \
            "CREATE DATABASE IF NOT EXISTS nominas_guate DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Sanitize dump (remove DEFINER) & import
        env:
          MYSQL_PWD: root
        run: |
          # Limpia DEFINER (problema común de permisos en MySQL 8)
          sed -i 's/DEFINER=`[^`]*`@`[^`]*`/DEFINER=CURRENT_USER/g' nominas_guate.sql
          # Importa el dump
          mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot --default-character-set=utf8mb4 nominas_guate < nominas_guate.sql

      # Reemplaza este smoke por tus pruebas reales (phpunit / scripts a SP)
      - name: Smoke DB
        env:
          MYSQL_PWD: root
        run: |
          mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -proot -D nominas_guate -e "SHOW TABLES;"

  # ====== BUILD & ARTIFACT ======
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact (zip)
        run: |
          mkdir -p build/RRHH_Nominas
          rsync -av --exclude '.git' --exclude '.github' ./ build/RRHH_Nominas/
          cd build && zip -r nominas_guate.zip RRHH_Nominas

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nominas_guate
          path: build/nominas_guate.zip
          if-no-files-found: error
          retention-days: 14

  # ====== RELEASE (solo en tags v*) ======
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nominas_guate
          path: ./dist

      - name: List artifact
        run: ls -lah ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/nominas_guate.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

