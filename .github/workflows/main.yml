name: CI - Nominas Guate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]                # dispara también cuando pushees un tag v*
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-nominas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====== ROOT JOB (sin needs) ======
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 -I{} php -l "{}"

  # ====== TESTS (con MySQL service) ======
  test:
    name: Tests (MySQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nominas_guate
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: mysqli

      - name: Wait for MySQL & import dump
        run: |
          for i in {1..30}; do
            if mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL listo"; break
            fi
            echo "Esperando MySQL... ($i)"; sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e \
            "CREATE DATABASE IF NOT EXISTS nominas_guate DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot nominas_guate < nominas_guate.sql

      # Reemplaza este smoke por tus pruebas reales (phpunit / scripts SP)
      - name: Smoke DB
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot -D nominas_guate -e "SHOW TABLES_
