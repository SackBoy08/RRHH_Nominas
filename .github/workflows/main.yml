name: CI - Nominas Guate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 -I{} php -l {}

      - name: Start MySQL
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: '8'

      - name: Create DB and import dump
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS nominas_guate;"
          mysql -h 127.0.0.1 -u root nominas_ci < nominas_guate.sql

      - name: Build artifact (pseudo-deploy)
        run: |
          mkdir -p build/RRHH_Nominas
          rsync -av --exclude '.git' --exclude '.github' ./ build/RRHH_Nominas/
          cd build && zip -r nominas_guate.zip RRHH_Nominas

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nominas_guate
          path: build/nominas_guate.zip
